# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: "[PR] Preview Firebase Hosting"
on:
  pull_request:
    paths:
      - apps/organization/**
      - .github/workflows/pr-preview-firebase-hosting.yml

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: apps/organization

jobs:
  build_and_preview:
    timeout-minutes: 7
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: vimex-sarl/delivery
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.pRef || 'main' }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun i --frozen-lockfile && bun run build
        env:
          VITE_FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON_DEV }}
          VITE_GOOGLE_MAP_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_DEV }}
          VITE_STRIPE_CLIENT_SECRET: ${{ secrets.STRIPE_CLIENT_SECRET_DEV }}
          VITE_GOOGLE_MAP_ID: ${{ secrets.DELIVERY_MAP_ID_WEB_DEV }}
          VITE_PUBLIC_WEBAPP_URL: ${{ vars.PUBLIC_WEBAPP_URL_DEV }}
          VITE_SERVER_API_ENDPOINT: ${{ vars.SERVER_API_ENDPOINT_DEV }}
          VITE_FCM_VAPID_KEY: ${{ vars.FCM_WEB_PUSH_VAPID_KEY_DEV }}
          VITE_APP_ENV: dev
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned exact: Node 24.17.0 has an http.Agent regression that makes
          # node-fetch (used by firebase-tools' bundled google-auth-library) throw
          # "Premature close" on the sts.googleapis.com token exchange, breaking
          # WIF-authenticated deploys. Fixed in 24.18.0. A bare '24' is not enough
          # — setup-node serves the runner-cached 24.17.0. Bump/relax once newer
          # 24.x are uniformly safe. See nodejs/node#63989 (fix: #64004).
          node-version: '24.18.0'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIMEX_COURSIER_DEV }}
          projectId: vimex-coursier-dev
          target: admin
